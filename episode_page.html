<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fur Friends</title>
<style>html,body{margin:0;height:100%;background:#1a1412;overflow:hidden}svg{display:block;width:100vw;height:100vh}</style></head>
<body><svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs id="defs"></defs><g id="scenes"></g>
<rect x="0" y="0" width="1920" height="1080" fill="url(#vig)" pointer-events="none"/>
<g id="ui"></g>
<rect id="flash" x="0" y="0" width="1920" height="1080" fill="#FFFFFF" opacity="0"/>
<rect id="fade" x="0" y="0" width="1920" height="1080" fill="#FFF4E8" opacity="1"/>
<rect id="dark" x="0" y="0" width="1920" height="1080" fill="#1a1412" opacity="0"/>
</svg>
<!-- usage: episode_page.html?ep=day005  (loads the shared engine, all location packs, the kit, then dayNNN_episode.js) -->
<script src="engine.js"></script>
<script src="locations.js"></script>
<script src="locs2.js"></script>
<script src="locs3.js"></script>
<script src="locs4.js"></script>
<script src="locs5.js"></script>
<script src="kit.js"></script>
<script>
  const EP_ID = (new URLSearchParams(location.search).get('ep') || 'day005').replace(/[^a-z0-9_]/gi, '');
  document.write('<script src="' + EP_ID + '_episode.js"><\/script>');
</script>
</body></html>
