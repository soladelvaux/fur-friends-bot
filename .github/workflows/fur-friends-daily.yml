name: Fur Friends Daily Episode

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      test_only:
        description: "Test only (render 20 seconds, no upload)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fur-friends-daily
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python packages and browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pick next episode
        id: pick
        run: echo "ep=$(python next_episode.py)" >> "$GITHUB_OUTPUT"

      - name: TEST render (20 seconds)
        if: ${{ inputs.test_only }}
        run: python render.py ${{ steps.pick.outputs.ep }} output/test.mp4 --seconds 20

      - name: TEST YouTube keys (no upload)
        if: ${{ inputs.test_only }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python upload.py --check

      - name: Download test video
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: test-episode
          path: output/test.mp4

      - name: Render full episode
        if: ${{ !inputs.test_only }}
        run: python render.py ${{ steps.pick.outputs.ep }} output/episode.mp4 --fps 60

      - name: Upload to YouTube
        if: ${{ !inputs.test_only }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python upload.py output/episode.mp4 ${{ steps.pick.outputs.ep }}_meta.json

      - name: Save progress
        if: ${{ !inputs.test_only }}
        run: |
          python next_episode.py --done
          git config user.name fur-friends-bot
          git config user.email fur-friends-bot@users.noreply.github.com
          git add state.json
          git commit -m "Posted ${{ steps.pick.outputs.ep }}" || true
          git push
